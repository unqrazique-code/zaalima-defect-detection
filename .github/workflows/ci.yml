name: CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn pydantic numpy opencv-python-headless
      - run: python -c "from src.utils import DEFECT_CLASSES; print('✅ utils OK')"
