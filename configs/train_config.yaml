# YOLOv8 Training Configuration
model: yolov8n.pt
data: configs/neu_augmented.yaml
epochs: 80
imgsz: 200
batch: 32
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
patience: 20
augment: true
mosaic: 1.0
mixup: 0.1
degrees: 10.0
fliplr: 0.5
flipud: 0.3
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
